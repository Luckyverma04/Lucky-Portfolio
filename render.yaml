services:
  - type: web
    name: lucky-portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_APP_EMAILJS_SERVICE_ID
        sync: false
      - key: VITE_APP_EMAILJS_TEMPLATE_ID
        sync: false
      - key: VITE_APP_EMAILJS_PUBLIC_KEY
        sync: false
